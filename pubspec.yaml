name: timora
description: A new Flutter project for Timora.
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^8.2.1
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
